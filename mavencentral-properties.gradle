// Local publication configuration used by publishToMavenLocal, plus credentials for publishing
// to Infomaniak's Reposilite instance (https://maven.infomaniak.app), following the same
// convention used by other Infomaniak Android projects (see e.g. android-kMail's OldKotlin
// PublishingPlugin, or android-pdfview's build.gradle.kts).
def getPropertyValue(String propertyName) {
    return project.findProperty(propertyName) ?: System.getenv(propertyName) ?: ""
}

def rootExt = rootProject.ext
rootExt["signBuild"] = getPropertyValue('signBuild')
rootExt["signing.password"] = getPropertyValue('signPassword')
rootExt["signing.secretKeyRingFile"] = getPropertyValue('signSecretRingFile').replaceAll('#','\n')
rootExt["reposiliteUsername"] = getPropertyValue('reposiliteUsername')
rootExt["reposilitePassword"] = getPropertyValue('reposilitePassword')
