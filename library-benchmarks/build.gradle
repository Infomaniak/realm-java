buildscript {
    def properties = new Properties()
    properties.load(new FileInputStream("${rootDir}/../dependencies.list"))
    ext.kotlin_version = properties.get('KOTLIN')
    repositories {
        mavenLocal()
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "androidx.benchmark:benchmark-gradle-plugin:1.5.0-rc01"
        classpath "com.android.tools.build:gradle:${properties.get("GRADLE_BUILD_TOOLS")}"
        classpath "io.realm:realm-gradle-plugin:${file("${rootDir}/../version.txt").text.trim()}"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${properties.get("KOTLIN")}"
    }
}

allprojects {
    def props = new Properties()
    props.load(new FileInputStream("${rootDir}/../dependencies.list"))
    props.each { key, val ->
        project.ext.set(key, val)
    }
}

apply plugin: 'com.android.library'
apply plugin: 'com.android.legacy-kapt'
apply plugin: 'realm-android'
apply plugin: 'androidx.benchmark'

android {
    namespace 'io.realm.benchmarks'
    compileSdk 37
    buildToolsVersion "${project.ext.get("ANDROID_BUILD_TOOLS")}"

    defaultConfig {
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.benchmark.junit4.AndroidBenchmarkRunner"
        testInstrumentationRunnerArguments (['androidx.benchmark.suppressErrors': 'EMULATOR,UNLOCKED'])
    }

    buildTypes {
        debug {
            minifyEnabled = false
            // Running with DEBUG = true will disable the JIT
            debuggable = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
}

repositories {
    mavenLocal()
    google()
    mavenCentral()
}

dependencies {
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation "androidx.benchmark:benchmark-junit4:1.5.0-rc01"
    androidTestImplementation 'junit:junit:4.13.2'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
}

