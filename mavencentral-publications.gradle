// Local-only publication helpers for publishToMavenLocal, plus a Reposilite remote repository
// (https://maven.infomaniak.app) for publishing pre-release/local-fork artifacts, mirroring the
// convention used across other Infomaniak Android projects.
apply plugin: 'maven-publish'
apply plugin: 'signing'
apply from: buildscript.sourceFile.getParent() + "/" + "mavencentral-properties.gradle"

def createPomDependencies(configurationNames) {
    return {
        def dependenciesNode = asNode().appendNode('dependencies')
        configurationNames.each { configurationName ->
            configurations[configurationName].allDependencies.each {
                if (it.group != null && it.name != null && it.name != 'realm-library') {
                    def dependencyNode = dependenciesNode.appendNode('dependency')
                    dependencyNode.appendNode('groupId', it.group)
                    dependencyNode.appendNode('artifactId', it.name)
                    dependencyNode.appendNode('version', it.version)
                    if (!it.excludeRules.empty) {
                        def exclusionsNode = dependencyNode.appendNode('exclusions')
                        it.excludeRules.each { rule ->
                            def exclusionNode = exclusionsNode.appendNode('exclusion')
                            exclusionNode.appendNode('groupId', rule.group)
                            exclusionNode.appendNode('artifactId', rule.module)
                        }
                    }
                }
            }
        }
    }
}

def populatePom(publication, pomName, pomDescription, pomDependencies = null) {
    publication.pom {
        name = pomName
        description = pomDescription
        url = 'https://github.com/realm/realm-java'
        licenses {
            license {
                name = 'The Apache Software License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'repo'
            }
        }
        issueManagement {
            system = 'github'
            url = 'https://github.com/realm/realm-java/issues'
        }
        scm {
            url = 'https://github.com/realm/realm-java'
            connection = 'scm:git:https://github.com/realm/realm-java.git'
            developerConnection = 'scm:git:ssh://git@github.com/realm/realm-java.git'
        }
        developers {
            developer {
                name = 'Realm'
                email = 'info@realm.io'
                organization = 'MongoDB'
                organizationUrl = 'https://www.mongodb.com'
            }
        }
    }
    if (pomDependencies) {
        publication.pom.withXml(pomDependencies)
    }
}

if (rootProject.ext["signBuild"].toString()) {
    signing {
        required { true }
        def ringFile = rootProject.ext["signing.secretKeyRingFile"]
        def password = rootProject.ext["signing.password"]
        useInMemoryPgpKeys(null, ringFile, password)
        sign publishing.publications
    }
}

// Publish to Infomaniak's Reposilite instance in addition to mavenLocal, so kDrive (and other
// consumers) can depend on a real remote artifact instead of requiring every developer to build
// and publishToMavenLocal this fork themselves. Snapshot versions (ending in "-SNAPSHOT") go to
// the snapshots repository, everything else goes to releases - same convention as
// android-kMail/OldKotlin and android-pdfview.
publishing {
    repositories {
        maven {
            name = 'reposilite'
            def isSnapshot = project.version.toString().endsWith('-SNAPSHOT')
            url = isSnapshot ? 'https://maven.infomaniak.app/snapshots' : 'https://maven.infomaniak.app/releases'
            credentials {
                username = rootProject.ext["reposiliteUsername"]
                password = rootProject.ext["reposilitePassword"]
            }
        }
    }
}

ext {
    createPomDependencies = this.&createPomDependencies
    populatePom = this.&populatePom
}
