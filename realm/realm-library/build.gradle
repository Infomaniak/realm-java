import com.android.build.api.artifact.SingleArtifact
import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.api.attributes.Attribute

apply plugin: 'com.android.library'
apply plugin: 'com.android.legacy-kapt'
apply plugin: 'com.github.spotbugs-base'
apply plugin: 'pmd'
apply plugin: 'checkstyle'
apply plugin: 'com.github.kt3k.coveralls'
apply plugin: 'de.undercouch.download'
// FIXME: https://github.com/realm/realm-java/issues/7551
//apply plugin: 'net.ltgt.errorprone'

def properties = new Properties()
properties.load(new FileInputStream("${projectDir}/../../dependencies.list"))

ext.ccachePath = project.findProperty('ccachePath') ?: System.getenv('NDK_CCACHE')
ext.lcachePath = project.findProperty('lcachePath') ?: System.getenv('NDK_LCACHE')

kapt {
    correctErrorTypes = true
}

android {
    namespace 'io.realm'
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionName version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        externalNativeBuild {
            cmake {
                if (project.ccachePath) arguments "-DNDK_CCACHE=$project.ccachePath"
                if (project.lcachePath) arguments "-DNDK_LCACHE=$project.lcachePath"
                if (project.hasProperty('buildTargetABIs') && !project.getProperty('buildTargetABIs').trim().isEmpty()) {
                    abiFilters(*project.getProperty('buildTargetABIs').trim().split('\\s*,\\s*'))
                } else {
                    // "armeabi" and "mips" are no longer supported by the NDK
                    abiFilters 'x86_64', 'armeabi-v7a', 'arm64-v8a'
                }

                arguments "-DREALM_JAVA_BUILD_CORE_FROM_SOURCE=${project.hasProperty('buildCore') && project.getProperty('buildCore').toBoolean()}"
                arguments "-DCMAKE_INTERPROCEDURAL_OPTIMIZATION=${!project.hasProperty('enableLTO') || project.getProperty('enableLTO').toBoolean()}"
                targets "realm-jni"
            }
        }
        // For running test as 32-bit only
        // ndk {
        //    abiFilters 'armeabi-v7a', 'x86'
        // }

        buildConfigField "String", "VERSION_NAME", "\"${version}\""

        buildTypes {
            debug {
                javaCompileOptions.with {
                    annotationProcessorOptions.arguments += ['realm.suppressWarnings': 'false']
                }
            }
        }
    }

    ndkVersion = rootProject.ext.ndkVersion

    externalNativeBuild {
        cmake {
            version = rootProject.ext.cmakeVersion
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    buildTypes {
        debug {
            // FIXME: If enabled, crashes with https://issuetracker.google.com/issues/37116868
            testCoverageEnabled = false
            // minifyEnabled = true;
            // proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        release {
            externalNativeBuild {
                cmake {
                }
            }
            // minifyEnabled = true;
        }
    }

    sourceSets {
        testObjectServer {
            kotlin.srcDirs += ['src/testObjectServer/kotlin']
        }
        androidTest {
            kotlin.srcDirs += ['src/androidTest/kotlin', 'src/testUtils/kotlin']
            // src/androidTest/kotlin and src/testUtils/kotlin contain some plain .java files
            // (e.g. entity classes) alongside the Kotlin sources. They need to also be declared
            // as java.srcDirs so javac picks them up; this used to happen implicitly but no
            // longer does with the Kotlin/AGP versions used for AGP9 compatibility.
            java.srcDirs += ['src/testUtils/java', 'src/androidTest/kotlin', 'src/testUtils/kotlin']
        }
        androidTestObjectServer {
            kotlin.srcDirs += [ 'src/syncIntegrationTest/kotlin',
                                'src/androidTestObjectServer/kotlin',
                                'src/syncTestUtils/kotlin' ]
            java.srcDirs += ['src/syncTestUtils/java']
            assets.srcDirs += ['src/syncIntegrationTest/assets/']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += ['META-INF/NOTICE.txt', 'META-INF/LICENSE.txt']
        }
        // We did strip with cmake for release build.
        // Please, Gradle, you are not that smart! Pleas DO NOT strip debug symbols for debug build!
        jniLibs {
            keepDebugSymbols += ['*/*/*.so']
            // Use compressed shared libraries to support 16 KB ELF alignment.
            useLegacyPackaging = true
        }
    }

    lint {
        abortOnError false
    }

    flavorDimensions 'api'

    productFlavors {
        base {
            dimension 'api'
            externalNativeBuild {
                cmake {
                    arguments "-DREALM_FLAVOR=base"
                }
            }
            consumerProguardFiles 'proguard-rules-consumer-common.pro', 'proguard-rules-consumer-base.pro'
            proguardFiles 'proguard-rules-build-common.pro'
        }
        objectServer {
            dimension 'api'
            externalNativeBuild {
                cmake {
                    arguments "-DREALM_FLAVOR=objectServer"
                }
            }
            consumerProguardFiles 'proguard-rules-consumer-common.pro', 'proguard-rules-consumer-objectServer.pro'
            proguardFiles 'proguard-rules-build-common.pro', 'proguard-rules-build-objectServer.pro'
        }
    }
}

// Stage 5 supports only the local-DB base release. Keep ObjectServer sources in
// the tree, but prevent their variants from entering this build's task graph.
def baseReleaseAar = objects.fileProperty()

androidComponents {
    beforeVariants(selector().withFlavor('api', 'objectServer')) { variantBuilder ->
        variantBuilder.enable = false
    }

    onVariants(selector().withFlavor('api', 'base').withBuildType('release')) { variant ->
        baseReleaseAar.set(variant.artifacts.get(SingleArtifact.AAR.INSTANCE))

        // AGP 9 removed direct configuration access to the per-variant JavaCompile task
        // (the old `android.libraryVariants.all { variant.javaCompileProvider... }` /
        // `tasks["compile${variant}JavaWithJavac"]` wiring no longer works). Instead of
        // committing a static snapshot of the JNI headers, generate them dynamically with
        // a standalone JavaCompile task that only recompiles the Java sources declaring
        // `native` methods (Realm's JNI surface is 100% Java, never Kotlin) purely to run
        // javac's `-h` header generation, decoupled from AGP's own compile task.
        //
        // Note: AGP deduplicates the CMake configure/build tasks by (CMake build type x ABI)
        // only, not by full Android variant name - the native code doesn't differ between the
        // 'base'/'objectServer' flavors or between debug/release, so these task names never
        // contain "Base"/"Release" (e.g. "configureCMakeRelWithDebInfo[arm64-v8a]"). A single
        // shared header set (built once, from the release classpath) is therefore enough for
        // every CMake task across all build types and ABIs.
        def jniHeadersDir = layout.buildDirectory.dir('generated/jni-headers/base')
        def jniClassesDir = layout.buildDirectory.dir('intermediates/jni-headers-classes/base')

        def generateJniHeaders = tasks.register('generateJniHeaders', JavaCompile) {
            group = 'build'
            description = "Generates the shared JNI headers (.h) without touching AGP's internal javac task"

            source = fileTree('src/main/java') + fileTree(layout.buildDirectory.dir('generated/source/buildConfig/base/release'))
            classpath = files(
                    androidComponents.sdkComponents.bootClasspath,
                    // `variant.compileConfiguration` only exposes 'api' dependencies; the
                    // actual AGP-generated compile classpath (matching what its own javac task
                    // uses, including 'implementation'/'compileOnly' deps like RxAndroid,
                    // ReLinker and the Kotlin stdlib) lives in the "<variant>CompileClasspath"
                    // configuration. AAR dependencies must go through an artifact view
                    // requesting the "android-classes-jar" type, otherwise javac receives the
                    // raw .aar file (which it cannot read) instead of the classes.jar within it.
                    configurations.getByName("${variant.name}CompileClasspath").incoming.artifactView {
                        attributes {
                            attribute(Attribute.of('artifactType', String), 'android-classes-jar')
                        }
                        lenient(true)
                    }.files,
                    // Some Java sources reference classes defined in this module's own Kotlin
                    // sources (e.g. io.realm.internal.coroutines). AGP 9's built-in Kotlin
                    // support compiles those to this intermediate directory before javac runs.
                    layout.buildDirectory.dir("intermediates/built_in_kotlinc/${variant.name}/compile${variant.name.capitalize()}Kotlin/classes")
            )
            dependsOn("compile${variant.name.capitalize()}Kotlin", "generate${variant.name.capitalize()}BuildConfig")
            options.compilerArgs.add('-nowarn')
            options.warnings = false
            destinationDirectory.set(jniClassesDir) // required by JavaCompile, but unused
            options.compilerArgs.addAll(['-h', jniHeadersDir.get().asFile.absolutePath, '-nowarn'])
            outputs.dir(jniHeadersDir)
        }

        // Lazily wire every CMake configure/build task (all ABIs, all build types) to depend
        // on header generation. `tasks.matching { }.configureEach { }` avoids eagerly
        // realizing tasks, keeping this compatible with task configuration avoidance.
        tasks.matching {
            it.name.startsWith('configureCMake') || it.name.startsWith('buildCMake')
        }.configureEach { it.dependsOn(generateJniHeaders) }
    }
}

// realm-library's own androidTest APK uses Realm on itself (its test entities need
// accessor bytecode generated), so the accessor transformer must be applied here too,
// just like consumer apps get it via the Realm Gradle plugin. Must be registered
// before RealmBuildTransformer, which only strips symbols from the already-merged Jar.
io.realm.transformer.RealmTransformerKt.registerRealmTransformerTask(project)

// Public Android Components/ScopedArtifacts transformer: remove ObjectServer API
// from the only supported local-DB artifact. The legacy consumer transformer stays removed.
io.realm.buildtransformer.RealmBuildTransformer.@Companion.register(
        project,
        'base',
        'io.realm.internal.annotations.ObjectServer',
)

base {
    archivesName = "realm-android-library"
}

// The stale transformer on the buildscript classpath cannot consume AGP 9's
// public DSL. It is consumer-plugin behavior, not library assembly behavior;
// assembleBaseRelease therefore uses only Android Components wiring.
tasks.withType(JavaCompile).configureEach {
    if (name != 'generateJniHeaders') {
        options.compilerArgs.add('-Xlint:-options')
        options.compilerArgs.add('-Werror')
    }
}

// AGP 9 built-in Kotlin replaces kotlin-android task configuration.
kotlin {
    compilerOptions {
        freeCompilerArgs.add('-Xjsr305=strict')
    }
}

coveralls.jacocoReportPath = "${buildDir}/reports/coverage/debug/report.xml"

repositories {
    maven { url "https://jitpack.io" }
    mavenCentral()
}

dependencies {
    compileOnly "io.reactivex.rxjava2:rxjava:${properties.getProperty('RXJAVA_DEPENDENCY')}"
    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.1.2'
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    compileOnly "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_android_version"
    compileOnly "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_android_version"
    androidTestImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_android_version"
    androidTestImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_android_version"

    testImplementation 'junit:junit:4.12'
    testImplementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    testImplementation "org.jetbrains.kotlin:kotlin-test:$kotlin_version"

    api "io.realm:realm-annotations:${version}"
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'com.getkeepsafe.relinker:relinker:1.4.3'
    api "org.mongodb:bson:${properties.getProperty('BSON_DEPENDENCY')}"
    implementation("io.reactivex.rxjava2:rxandroid:${properties.getProperty('RXANDROID_DEPENDENCY')}") {
        exclude group: 'io.reactivex.rxjava2', module: 'rxjava'
    }

    androidTestImplementation "androidx.multidex:multidex:2.0.1"

    kapt project(':realm-annotations-processor') // See https://github.com/realm/realm-java/issues/5799
    objectServerImplementation 'com.squareup.okhttp3:okhttp:3.12.0' // Going above this requires minSDK 21
    kaptAndroidTest project(':realm-annotations-processor')
    androidTestImplementation "org.jetbrains.kotlin:kotlin-test:$kotlin_version"
    androidTestImplementation "io.reactivex.rxjava2:rxjava:${properties.getProperty('RXJAVA_DEPENDENCY')}"
    androidTestImplementation "io.reactivex.rxjava2:rxandroid:${properties.getProperty('RXANDROID_DEPENDENCY')}"
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'com.google.dexmaker:dexmaker:1.2'
    androidTestImplementation 'com.google.dexmaker:dexmaker-mockito:1.2'
    androidTestImplementation 'org.hamcrest:hamcrest-library:1.3'
    androidTestImplementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    androidTestImplementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    androidTestImplementation "org.skyscreamer:jsonassert:1.5.0"
    androidTestImplementation project(':kotlin-extensions')

    // specify error prone version to prevent sudden failure
//    errorprone 'com.google.errorprone:error_prone_core:2.8.1'
}

task sourcesJar(type: Jar) {
    from android.sourceSets.main.java.srcDirs
    from android.sourceSets.main.kotlin.srcDirs
    archiveClassifier.set('sources')
}

task javadoc(type: Javadoc) {
    failOnError false
    source android.sourceSets.main.java.srcDirs
    source android.sourceSets.main.kotlin.srcDirs
    source "../../realm-annotations/src/main/java"
    classpath.from(providers.provider {
        androidComponents.sdkComponents.bootClasspath.get()
    })

    options {
        title = "Realm ${project.version}"
        memberLevel = JavadocMemberLevel.PUBLIC
        docEncoding = 'UTF-8'
        encoding = 'UTF-8'
        charSet = 'UTF-8'
        locale = 'en_US'
        overview = 'src/overview.html'

        links "https://docs.oracle.com/javase/7/docs/api/"
        links "http://reactivex.io/RxJava/javadoc/"
        links "https://developer.android.com/reference"
        links "https://www.javadoc.io/doc/org.mongodb/bson/${properties.getProperty('BSON_DEPENDENCY')}/"
    }
    exclude '**/internal/**'
    exclude '**/BuildConfig.java'
    exclude '**/R.java'
    exclude '**/*.kt'
    doLast {
        copy {
            from "src/realm-java-overview.png"
            into "$buildDir/docs/javadoc"
        }
    }
}

task javadocJar(type: Jar, dependsOn: javadoc) {
    archiveClassifier.set('javadoc')
    from javadoc.destinationDir
}

// See https://spotbugs-gradle-plugin.netlify.app/com/github/spotbugs/snom/spotbugsextension
spotbugs {
    toolVersion = '4.1.1'
    ignoreFailures = false
    effort = "default"
    reportLevel = "medium"
    excludeFilter = file("${projectDir}/../config/findbugs/findbugs-filter.xml")
}

// See https://spotbugs.readthedocs.io/en/latest/migration.html#findbugs-gradle-plugin
task spotbugsMain(type: com.github.spotbugs.snom.SpotBugsTask) {
    dependsOn 'assemble'
    group = 'verification'
    classes = fileTree("build/intermediates/javac/")

}

task pmd(type: Pmd) {
    group = 'verification'

    source = fileTree('src/main/java') + fileTree('src/objectServer/java')
    ruleSetFiles = files("${projectDir}/../config/pmd/ruleset.xml")

    ruleSets = []

    reports {
        xml.required.set(false)
        html.required.set(true)
    }
}

// Configure Checkstyle
// Android sourceSets are not sourceSets, so we can't confgure this with the DSL.
task checkstyle(type: Checkstyle) {
    group = 'verification'
    configFile file("${projectDir}/../config/checkstyle/checkstyle.xml")

    source fileTree('src/main/java') + fileTree('src/objectServer/java')
    include '**/*.java'
    exclude '**/gen/**'

    // empty classpath
    classpath = files()

    reports {
        xml.required.set(false)
        html.required.set(true)
    }
}

apply from: "${rootDir}/../mavencentral-publications.gradle"

publishing {
    publications {
        basePublication(MavenPublication) {
            groupId 'io.realm'
            artifactId 'realm-android-library'
            version project.version
            artifact(baseReleaseAar)
            artifact sourcesJar
            artifact javadocJar
            populatePom(
                    it,
                    'realm-android-library',
                    'Realm is a mobile database: Build better apps, faster.',
                    createPomDependencies(["baseImplementation", "implementation", "baseApi", "api"])
            )
        }
    }
}

artifacts {
    archives javadocJar
    archives sourcesJar
}

if (project.hasProperty('dontCleanJniFiles')) {
    project.afterEvaluate {
        tasks.all { task ->
            if (task.name.startsWith('externalNativeBuildClean')) {
                task.enabled = false
            }
        }
    }
} else {
    task cleanExternalBuildFiles(type: Delete) {
        delete project.file('.externalNativeBuild')
        delete project.file('.cxx')
        // Clean .so files that were created by old build script (realm/realm-jni/build.gradle).
        delete project.file('src/main/jniLibs')
    }
    clean.dependsOn cleanExternalBuildFiles
}

static def getValueFromPropertiesFile(File propFile, String key) {
    if (!propFile.isFile() || !propFile.canRead()) {
        return null
    }
    def prop = new Properties()
    def reader = propFile.newReader()
    try {
        prop.load(reader)
    } finally {
        reader.close()
    }
    return prop.get(key)
}
